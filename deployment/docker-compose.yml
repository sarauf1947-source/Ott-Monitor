x-logging: &default-logging
  driver: json-file
  options: { max-size: "100m", max-file: "5" }
x-restart: &default-restart
  restart: unless-stopped

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ott_timescaledb
    <<: *default-restart
    environment:
      POSTGRES_USER: ott_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ott_monitor
      TIMESCALEDB_TELEMETRY: "off"
    volumes: [timescaledb_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ott_user -d ott_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: ott_redis
    <<: *default-restart
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    build: { context: .., dockerfile: deployment/Dockerfile.api }
    container_name: ott_api
    <<: *default-restart
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ott_user:${DB_PASSWORD:-changeme}@timescaledb:5432/ott_monitor
      REDIS_URL: redis://redis:6379
      ENV: production
    ports: ["8000:8000"]
    depends_on:
      timescaledb: { condition: service_healthy }
      redis:       { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL","curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  worker:
    build: { context: .., dockerfile: deployment/Dockerfile.worker }
    <<: *default-restart
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ott_user:${DB_PASSWORD:-changeme}@timescaledb:5432/ott_monitor
      REDIS_URL: redis://redis:6379
      TOTAL_WORKERS: ${TOTAL_WORKERS:-15}
    depends_on:
      timescaledb: { condition: service_healthy }
      redis:       { condition: service_healthy }
      api:         { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:   { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
    logging: *default-logging

  frontend:
    build: { context: .., dockerfile: deployment/Dockerfile.frontend }
    container_name: ott_frontend
    <<: *default-restart
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL","curl -sf http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  timescaledb_data:
  redis_data:
networks:
  default:
    name: ott_monitor_net
