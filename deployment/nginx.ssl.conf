# deployment/nginx.ssl.conf
# Replace deployment/nginx.frontend.conf with this file to enable HTTPS
# with a self-signed certificate generated by OpenSSL.
#
# Step 1: generate cert on your server (one-time, run on Ubuntu host)
#   sudo mkdir -p /opt/ott_monitor/ssl
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /opt/ott_monitor/ssl/ott.key \
#     -out    /opt/ott_monitor/ssl/ott.crt \
#     -subj "/C=US/ST=State/L=City/O=OTT Monitor/CN=ott-monitor.local"
#   sudo chmod 600 /opt/ott_monitor/ssl/ott.key
#
# Step 2: mount the ssl directory into the frontend container.
# Add this to the frontend service in docker-compose.yml:
#   volumes:
#     - /opt/ott_monitor/ssl:/etc/nginx/ssl:ro
#
# Step 3: replace nginx.frontend.conf with this file:
#   cp deployment/nginx.ssl.conf deployment/nginx.frontend.conf
#
# Step 4: rebuild frontend:
#   docker compose -f deployment/docker-compose.yml build --no-cache frontend
#   docker compose -f deployment/docker-compose.yml up -d
#
# Browser warning: self-signed certs show "Not secure" warning.
# To trust it: add ott.crt to your browser or OS certificate store.

server {
    listen 80;
    server_name _;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ott.crt;
    ssl_certificate_key /etc/nginx/ssl/ott.key;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
